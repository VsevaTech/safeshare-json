name: Cleanup bootstrap artifacts

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove bootstrap artifacts and this workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f --ignore-unmatch tmp-binary-probe.png PROBE.txt .github/workflows/cleanup.yml
          if git diff --staged --quiet; then
            echo 'Nothing to clean.'
          else
            git commit -m 'chore: remove repository bootstrap artifacts [skip ci]'
            git push
          fi
